table: person_consent_grant
domain: person
status: published
public_id_prefix: cg
immutable: true
description: One consent decision by one person. Written once; a withdrawal is a new row.
columns:
  - {name: person_id, type: uuid, references: org_person.id, description: Who decided.}
  - {name: policy_code, type: text, description: Which policy the decision concerns.}
  - {name: decision, type: text, enum: consent_decision, description: What was decided.}
  - {name: revokes_grant_id, type: uuid, nullable: true, references: person_consent_grant.id, description: The grant this row withdraws.}
  - {name: signed_at, type: timestamptz, description: When the person decided.}
checks:
  - {name: ck_pcg_revoke_link, expr: "(decision = 'REVOKED') = (revokes_grant_id IS NOT NULL)", description: Only a REVOKED row points at a prior grant.}
indexes:
  - {columns: [person_id, policy_code]}
business_rules:
  - {id: BR-PERSON_CONSENT_GRANT-001, text: A row is never updated or deleted. A correction is a new row., enforced_by: db}
  - {id: BR-PERSON_CONSENT_GRANT-002, text: A REVOKED row references the grant it withdraws., enforced_by: db}
