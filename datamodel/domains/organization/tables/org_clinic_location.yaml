table: org_clinic_location
domain: organization
status: published
public_id_prefix: loc
description: A site an organization delivers care from.
columns:
  - {name: organization_id, type: uuid, references: organization.id, description: Owning organization.}
  - {name: location_name, type: text, description: Name of the site.}
  - {name: timezone, type: text, description: "IANA timezone, e.g. America/Chicago."}
  - {name: telehealth, type: bool, default: "false", description: Whether the site delivers telehealth.}
  - {name: phone, type: text, nullable: true, pii: indirect, description: Site phone number.}
unique: [[organization_id, location_name]]
indexes:
  - {columns: [organization_id]}
business_rules:
  - {id: BR-ORG_CLINIC_LOCATION-001, text: A location name is unique within its organization.}
sample_rows:
  - {organization_id: "(organization.display_name=Example Wellness)", location_name: Austin Clinic, timezone: America/Chicago, telehealth: false}
