name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: plumbline
          POSTGRES_PASSWORD: plumbline
          POSTGRES_DB: plumbline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plumbline -d plumbline"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway CI credentials for the service container above.
      DATABASE_URL: postgresql://plumbline:plumbline@localhost:5432/plumbline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra ollama
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -rs # -rs shows why anything skipped

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes @fission-ai/openspec@1.8.0 validate --all

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_links.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r docs-requirements.txt
      - run: mkdocs build --strict
      - uses: crate-ci/typos@v1
