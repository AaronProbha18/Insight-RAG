[build]
  command = "pip install -r docs-requirements.txt && mkdocs build --strict"
  publish = "site"
  # Skip the build unless the site inputs changed; a skipped build leaves the live site as is.
  # Exit 0 = skip, exit 1 = build. UNVERIFIED: confirm against Netlify docs.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- docs mkdocs.yml docs-requirements.txt netlify.toml"

[build.environment]
  # UNVERIFIED: confirm PYTHON_VERSION is honoured by Netlify's build image.
  PYTHON_VERSION = "3.12"
