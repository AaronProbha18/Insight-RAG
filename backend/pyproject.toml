[project]
name = "plumbline-rag"
version = "0.0.0"
description = "Open-source RAG with pluggable connectors and measured answer quality"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.163.1",
    "langchain>=1.5.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.22",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plumbline"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs Postgres (skipped when unreachable)",
    "llm: needs a real model via Ollama (skipped when unreachable)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[project.entry-points."plumbline.connectors"]
pdf = "plumbline.connectors.builtin.pdf:PdfConnector"
docx = "plumbline.connectors.builtin.docx:DocxConnector"

[project.scripts]
plumbline-eval = "plumbline.evals.runner:main"

[project.optional-dependencies]
ollama = [
    "langchain-ollama>=1.1.0",
]
