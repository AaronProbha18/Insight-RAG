services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      # Local-only defaults; override in .env for any real deployment.
      POSTGRES_USER: ${POSTGRES_USER:-plumbline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plumbline}
      POSTGRES_DB: ${POSTGRES_DB:-plumbline}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql # pg18+ image volume root (PGDATA lives below it)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Inside compose the database is the `db` service, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-plumbline}:${POSTGRES_PASSWORD:-plumbline}@db:5432/${POSTGRES_DB:-plumbline}
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach Ollama running on the host
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
